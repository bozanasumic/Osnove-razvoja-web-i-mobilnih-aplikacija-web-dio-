<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="utf-8">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <main class="kalkulator">
        <button id="tema"> Dark mode </button>
        <h1>Kalkulator</h1>
        <div class="polja">
            <input type="number" id="a" placeholder="Prvi broj">
            <input type="number" id="b" placeholder="Drugi broj">
        </div>
        <div class="gumbi">
            <button id="zbroji">+</button>
            <button id="oduzmi">−</button>
            <button id="pomnozi">×</button>
            <button id="podijeli">÷</button>
        </div>
        <p id="rezultat"></p>
    </main>
</body>

</html>
